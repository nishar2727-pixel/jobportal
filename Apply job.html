<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Job</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">JobPortal</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="My application.html">My Applications</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<div class="form-container">

    <h1>Apply for Job</h1>
    <p class="job-name">Frontend Developer - ABC Technologies</p>

    <form id="applicationForm" onsubmit="submitApplication(event)">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter phone number" required>

        <label>Highest Qualification</label>
        <select required>
            <option value="">Select Qualification</option>
            <option>B.E / B.Tech</option>
            <option>B.Sc</option>
            <option>BCA</option>
            <option>M.E / M.Tech</option>
            <option>MCA</option>
            <option>Other</option>
        </select>

        <label>Experience</label>
        <input type="text" placeholder="Example: 1 Year">

        <label>Resume</label>
        <input type="file" required>

        <label>Cover Letter</label>
        <textarea rows="5" placeholder="Write your cover letter"></textarea>

        <button type="submit" class="btn">Submit Application</button>

    </form>

</div>
</div>

<script>
function submitApplication(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;

    localStorage.setItem("applicantName", name);
    localStorage.setItem("applicantEmail", email);
    localStorage.setItem("applicantPhone", phone);

    alert("Application submitted successfully!");

    window.location.href = "My application.html";
}
</script>

</body>
</html>
